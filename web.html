<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Minimax AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #11111b;
            color: #cdd6f4;
        }
        .card {
            background: #1e1e2e;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            text-align: center;
            width: 360px;
        }
        h1 { margin: 0 0 4px; font-size: 1.5rem; }
        .sub { font-size: 0.85rem; color: #a6adc8; margin-bottom: 18px; }
        .controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .diff-btn {
            flex: 1;
            padding: 8px 6px;
            border: 1px solid #45475a;
            background: #313244;
            color: #cdd6f4;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .diff-btn:hover { background: #45475a; }
        .diff-btn.active { background: #89b4fa; color: #11111b; border-color: #89b4fa; }
        #status {
            font-size: 1.1rem;
            font-weight: 600;
            color: #a6e3a1;
            margin-bottom: 14px;
            min-height: 24px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .cell {
            aspect-ratio: 1 / 1;
            background: #313244;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #cdd6f4;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cell:hover:not(:disabled) { background: #45475a; }
        .cell:disabled { cursor: default; }
        .cell.x { color: #89b4fa; }
        .cell.o { color: #f38ba8; }
        .cell.win { background: rgba(166, 227, 161, 0.2); border-color: #a6e3a1; }
        .stats {
            font-size: 0.8rem;
            color: #a6adc8;
            margin-bottom: 16px;
        }
        #reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #cba6f7;
            color: #11111b;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        #reset-btn:hover { background: #b4befe; }
    </style>
</head>
<body>

<div class="card">
    <h1>Tic-Tac-Toe AI</h1>
    <div class="sub">You: <strong>X</strong> • Minimax AI: <strong>O</strong></div>

    <div class="controls">
        <button class="diff-btn" id="btn-easy" onclick="setDepth(1, 'btn-easy')">Easy (d=1)</button>
        <button class="diff-btn" id="btn-med" onclick="setDepth(3, 'btn-med')">Medium (d=3)</button>
        <button class="diff-btn active" id="btn-hard" onclick="setDepth(9, 'btn-hard')">Hard (d=9)</button>
    </div>

    <div id="status">Your turn — click a square</div>

    <div class="board" id="board">
        <button class="cell" id="cell-0" onclick="handleClick(0)"></button>
        <button class="cell" id="cell-1" onclick="handleClick(1)"></button>
        <button class="cell" id="cell-2" onclick="handleClick(2)"></button>
        <button class="cell" id="cell-3" onclick="handleClick(3)"></button>
        <button class="cell" id="cell-4" onclick="handleClick(4)"></button>
        <button class="cell" id="cell-5" onclick="handleClick(5)"></button>
        <button class="cell" id="cell-6" onclick="handleClick(6)"></button>
        <button class="cell" id="cell-7" onclick="handleClick(7)"></button>
        <button class="cell" id="cell-8" onclick="handleClick(8)"></button>
    </div>

    <div class="stats" id="stats">Positions examined: 0</div>
    <button id="reset-btn" onclick="resetGame()">Restart Game</button>
</div>

<script>
    // --- GAME LOGIC ---
    const WIN_LINES = ["012", "345", "678", "036", "147", "258", "048", "246"];

    function createBoard() {
        return [' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '];
    }

    function checkWinner(board) {
        for (const line of WIN_LINES) {
            const a = Number(line[0]);
            const b = Number(line[1]);
            const c = Number(line[2]);
            if (board[a] !== ' ' && board[a] === board[b] && board[a] === board[c]) {
                return { winner: board[a], line: [a, b, c] };
            }
        }
        if (!board.includes(' ')) {
            return { winner: 'draw', line: [] };
        }
        return null;
    }

    function getLegalMoves(board) {
        const moves = [];
        for (let i = 0; i < 9; i++) {
            if (board[i] === ' ') moves.push(i);
        }
        return moves;
    }

    function makeMove(board, position, player) {
        const newBoard = [...board];
        newBoard[position] = player;
        return newBoard;
    }

    // --- MINIMAX AI WITH ALPHA-BETA PRUNING ---
    let nodesExpanded = 0;

    function minimax(board, depth, isMaximizing, alpha, beta) {
        nodesExpanded++;
        const res = checkWinner(board);
        if (res) {
            if (res.winner === 'O') return 10 + depth;
            if (res.winner === 'X') return -10 - depth;
            return 0;
        }
        if (depth === 0) return 0;

        if (isMaximizing) {
            let bestScore = -Infinity;
            for (const move of getLegalMoves(board)) {
                const score = minimax(makeMove(board, move, 'O'), depth - 1, false, alpha, beta);
                bestScore = Math.max(bestScore, score);
                alpha = Math.max(alpha, bestScore);
                if (beta <= alpha) break;
            }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (const move of getLegalMoves(board)) {
                const score = minimax(makeMove(board, move, 'X'), depth - 1, true, alpha, beta);
                bestScore = Math.min(bestScore, score);
                beta = Math.min(beta, bestScore);
                if (beta <= alpha) break;
            }
            return bestScore;
        }
    }

    function getBestMove(board, player, depth) {
        let bestScore = -Infinity;
        let bestMoves = [];
        for (const move of getLegalMoves(board)) {
            const score = minimax(makeMove(board, move, player), depth - 1, false, -Infinity, Infinity);
            if (score > bestScore) {
                bestScore = score;
                bestMoves = [move];
            } else if (score === bestScore) {
                bestMoves.push(move);
            }
        }
        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    }

    // --- UI STATE & INTERACTION ---
    let board = createBoard();
    let gameOver = false;
    let searchDepth = 9;
    let winLine = [];

    function setDepth(newDepth, btnId) {
        searchDepth = newDepth;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');
        resetGame();
    }

    function updateUI() {
        for (let i = 0; i < 9; i++) {
            const cell = document.getElementById(`cell-${i}`);
            const val = board[i];
            cell.innerText = val === ' ' ? '' : val;
            cell.className = 'cell';
            if (val === 'X') cell.classList.add('x');
            if (val === 'O') cell.classList.add('o');
            if (winLine.includes(i)) cell.classList.add('win');
            cell.disabled = (val !== ' ' || gameOver);
        }
    }

    function handleClick(pos) {
        if (board[pos] !== ' ' || gameOver) return;

        // 1. Human move
        board = makeMove(board, pos, 'X');
        let res = checkWinner(board);
        if (res) return finishGame(res);

        // 2. AI move
        nodesExpanded = 0;
        const aiPos = getBestMove(board, 'O', searchDepth);
        board = makeMove(board, aiPos, 'O');
        document.getElementById('stats').innerText = `Positions examined: ${nodesExpanded}`;

        res = checkWinner(board);
        if (res) return finishGame(res);

        document.getElementById('status').innerText = 'Your turn (X)';
        updateUI();
    }

    function finishGame(res) {
        gameOver = true;
        winLine = res.line;
        const status = document.getElementById('status');
        if (res.winner === 'X') {
            status.innerText = 'You win!';
            status.style.color = '#89b4fa';
        } else if (res.winner === 'O') {
            status.innerText = 'AI wins!';
            status.style.color = '#f38ba8';
        } else {
            status.innerText = "It's a draw!";
            status.style.color = '#f9e2af';
        }
        updateUI();
    }

    function resetGame() {
        board = createBoard();
        gameOver = false;
        winLine = [];
        const status = document.getElementById('status');
        status.innerText = 'Your turn — click a square';
        status.style.color = '#a6e3a1';
        document.getElementById('stats').innerText = 'Positions examined: 0';
        updateUI();
    }

    resetGame();
</script>

</body>
</html>
